version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analytics-api
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - .env
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    # Tight memory envelope for the E2.1.Micro instance (1 GB total).
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
